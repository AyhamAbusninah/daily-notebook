name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1 fonts-dejavu-core
      - run: pip install PySide6-Essentials pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            icon: ""
          - os: windows-latest
            name: windows-x64
            icon: "--icon data/icon.ico"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Linux build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1 libglib2.0-0
      - run: pip install PySide6-Essentials pyinstaller
      - name: Build
        shell: bash
        run: pyinstaller --noconfirm --clean --windowed --name DailyNotebook ${{ matrix.icon }} packaging/run.py
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/DailyNotebook/DailyNotebook --selftest
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DailyNotebook\DailyNotebook.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/data
          cp -r dist/DailyNotebook stage/
          cp install.sh uninstall.sh stage/
          cp data/io.github.dailynotebook.svg stage/data/
          tar -czf DailyNotebook-${{ matrix.name }}.tar.gz -C stage .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\DailyNotebook -DestinationPath DailyNotebook-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DailyNotebook-${{ matrix.name }}
          path: |
            DailyNotebook-${{ matrix.name }}.tar.gz
            DailyNotebook-${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
